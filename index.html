<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apple Bomb Snake</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#c9d4a2; --screen:#a8b97f; --ink:#22301a; --soft:#5d6e3a;
  --apple:#9c2a1e; --leaf:#2f5a22; --shine:#e8d9b0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161d11; --screen:#222d19; --ink:#b9d08c; --soft:#6f8a45;
    --apple:#e5584a; --leaf:#7fbf5a; --shine:#ffd9c9; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161d11; --screen:#222d19; --ink:#b9d08c; --soft:#6f8a45;
  --apple:#e5584a; --leaf:#7fbf5a; --shine:#ffd9c9; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;
  display:flex; justify-content:center; align-items:center; padding:16px;
}
main{width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:14px}
h1{font-size:16px; text-align:center; margin:0; font-weight:400; letter-spacing:1px}
.hud{display:flex; justify-content:space-between; width:100%; font-size:10px}
.bezel{
  width:100%; padding:10px; background:var(--ink); border-radius:6px;
}
canvas{
  display:block; width:100%; height:auto; aspect-ratio:1/1; background:var(--screen);
  image-rendering:pixelated; touch-action:none;
}
.pad{display:grid; grid-template-columns:repeat(3,80px); grid-template-rows:repeat(2,80px); gap:10px; margin-top:4px}
.pad button{
  font:inherit; font-size:28px; touch-action:manipulation; user-select:none; -webkit-user-select:none; color:var(--bg); background:var(--ink); border:0;
  border-radius:4px; cursor:pointer; box-shadow:0 4px 0 var(--soft);
}
.pad button:active{transform:translateY(3px); box-shadow:0 1px 0 var(--soft)}
.pad button:focus-visible{outline:3px solid var(--apple); outline-offset:2px}
.pad .up{grid-column:2; grid-row:1}
.pad .left{grid-column:1; grid-row:2}
.pad .down{grid-column:2; grid-row:2}
.pad .right{grid-column:3; grid-row:2}
.pad .act{grid-column:3; grid-row:1; font-size:10px}
.levels{display:flex; gap:8px; width:100%}
.levels button{flex:1; font:inherit; font-size:10px; padding:12px 4px; cursor:pointer; color:var(--ink); background:transparent; border:3px solid var(--ink); border-radius:4px}
.levels button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.levels button:focus-visible{outline:3px solid var(--apple); outline-offset:2px}
p{font-size:8px; line-height:1.8; margin:0; text-align:center; color:var(--soft)}
</style>
</head>
<body>
<main>
  <h1>APPLE BOMB SNAKE</h1>
  <div class="levels" role="group" aria-label="Level">
    <button data-level="low" aria-pressed="false">LOW</button>
    <button data-level="medium" aria-pressed="true">MEDIUM</button>
    <button data-level="high" aria-pressed="false">HIGH</button>
  </div>
  <div class="hud"><span id="score">SCORE 0</span><span id="best">BEST 0</span></div>
  <div class="bezel"><canvas id="c" aria-label="Snake game board"></canvas></div>
  
  <p>W A S D to move. Space to pause. Careful: one apple is a bomb!</p>
</main>
<script>
const N = 22, C = 20;
const cv = document.getElementById('c'), g = cv.getContext('2d');
cv.width = cv.height = N * C;
const $score = document.getElementById('score'), $best = document.getElementById('best');
let snake, dir, nextDir, apple, score, speed, state = 'ready', timer, best = 0, bomb = null, exploded = false;
const LEVELS = { low:{start:260,min:160,step:2,bomb:0.015}, medium:{start:190,min:110,step:2,bomb:0.025}, high:{start:130,min:65,step:3,bomb:0.04} };
let level = 'medium';
function loadBest() { best = 0; try { best = +localStorage.getItem('pixelSnakeBest-' + level) || 0; } catch (e) {} }

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

function reset() {
  clearTimeout(timer);
  snake = [{x:11,y:11},{x:10,y:11},{x:9,y:11}];
  dir = nextDir = { x:1, y:0 };
  score = 0; speed = LEVELS[level].start; loadBest(); bomb = null; exploded = false; state = 'ready';
  placeApple(); hud(); draw();
}
function placeApple() {
  do { apple = { x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N) }; }
  while (snake.some(s => s.x === apple.x && s.y === apple.y) || (bomb && bomb.x === apple.x && bomb.y === apple.y));
}
function maybeBomb() {
  if (bomb) { bomb.life--; if (bomb.life <= 0) bomb = null; return; }
  if (Math.random() > LEVELS[level].bomb) return;
  for (let i = 0; i < 30; i++) {
    const c = { x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N) };
    const far = Math.abs(c.x - snake[0].x) + Math.abs(c.y - snake[0].y) > 5;
    if (far && !snake.some(s => s.x === c.x && s.y === c.y) && !(c.x === apple.x && c.y === apple.y)) {
      bomb = { x:c.x, y:c.y, life:50 }; return;
    }
  }
}
function hud() {
  $score.textContent = 'SCORE ' + score;
  $best.textContent = 'BEST ' + best;
}
function turn(dx, dy) {
  if (state === 'over') return;
  if (dx + dir.x === 0 && dy + dir.y === 0) return;
  nextDir = { x:dx, y:dy };
  if (state === 'ready' || state === 'paused') start();
}
function start() { state = 'running'; clearTimeout(timer); tick(); }
function togglePause() {
  if (state === 'over') return reset();
  if (state === 'running') { state = 'paused'; clearTimeout(timer); draw(); }
  else start();
}
function tick() {
  if (state !== 'running') return;
  dir = nextDir;
  const head = { x:snake[0].x + dir.x, y:snake[0].y + dir.y };
  const eat = head.x === apple.x && head.y === apple.y;
  const body = eat ? snake : snake.slice(0, -1);
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
      body.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  if (bomb && head.x === bomb.x && head.y === bomb.y) { exploded = true; snake.unshift(head); return gameOver(); }
  snake.unshift(head);
  if (eat) {
    score++; speed = Math.max(LEVELS[level].min, speed - LEVELS[level].step);
    if (score > best) { best = score; try { localStorage.setItem('pixelSnakeBest-' + level, best); } catch (e) {} }
    if (snake.length === N * N) return gameOver();
    placeApple(); hud();
  } else snake.pop();
  maybeBomb();
  draw();
  timer = setTimeout(tick, speed);
}
function gameOver() { state = 'over'; clearTimeout(timer); hud(); draw(); }

function px(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function draw() {
  const ink = css('--ink'), screen = css('--screen');
  px(0, 0, N*C, N*C, screen);
  // apple
  const ax = apple.x*C, ay = apple.y*C;
  px(ax+4, ay+7, 12, 10, css('--apple'));
  px(ax+3, ay+9, 14, 6, css('--apple'));
  px(ax+5, ay+9, 2, 3, css('--shine'));
  px(ax+9, ay+3, 2, 4, ink);
  px(ax+11, ay+3, 4, 2, css('--leaf'));
  // bomb apple (looks like an apple, but darker, with a burning fuse)
  if (bomb && !(bomb.life <= 10 && bomb.life % 2 === 0)) {
    const bx = bomb.x*C, by = bomb.y*C;
    px(bx+4, by+7, 12, 10, css('--apple'));
    px(bx+3, by+9, 14, 6, css('--apple'));
    g.globalAlpha = .35; px(bx+3, by+7, 14, 10, ink); g.globalAlpha = 1;
    px(bx+9, by+3, 2, 4, ink);
    px(bx+11, by+2, 3, 2, '#f2b134');
    px(bx+14, by+1, 2, 2, '#e8531f');
  }
  // snake
  snake.forEach((s, i) => px(s.x*C+1, s.y*C+1, C-2, C-2, ink));
  const h = snake[0], hx = h.x*C, hy = h.y*C;
  const ex = dir.x === 1 ? [13,13] : dir.x === -1 ? [4,4] : [4,13];
  const ey = dir.y === 1 ? [13,13] : dir.y === -1 ? [4,4] : [4,13];
  px(hx+ex[0], hy+ey[0], 3, 3, screen);
  px(hx+ex[1], hy+ey[1], 3, 3, screen);
  if (state !== 'running') overlay();
}
function overlay() {
  g.fillStyle = css('--screen'); g.globalAlpha = .82; g.fillRect(0, 0, N*C, N*C); g.globalAlpha = 1;
  g.fillStyle = css('--ink'); g.textAlign = 'center';
  g.font = '16px "Press Start 2P", monospace';
  const msg = state === 'over' ? [exploded ? 'BOOM!' : 'GAME OVER', 'Score ' + score, 'Space to retry']
            : state === 'paused' ? ['PAUSED', '', 'Press W A S D']
            : ['APPLE BOMB SNAKE', '', 'Press W A S D'];
  g.fillText(msg[0], N*C/2, N*C/2 - 30);
  g.font = '10px "Press Start 2P", monospace';
  g.fillText(msg[1], N*C/2, N*C/2);
  g.fillText(msg[2], N*C/2, N*C/2 + 30);
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = { w:'up', s:'down', a:'left', d:'right' };
  if (map[k]) { e.preventDefault(); turn(...DIRS[map[k]]); }
  else if (k === ' ' || k === 'p' || k === 'enter') { e.preventDefault(); togglePause(); }
});
document.querySelectorAll('[data-d]').forEach(b =>
  b.addEventListener('pointerdown', e => { e.preventDefault(); turn(...DIRS[b.dataset.d]); }));


let t0 = null;
cv.addEventListener('touchstart', e => { t0 = e.touches[0]; }, { passive:true });
cv.addEventListener('touchend', e => {
  if (!t0) return;
  const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return togglePause();
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  t0 = null;
});
document.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => {
  level = b.dataset.level;
  document.querySelectorAll('[data-level]').forEach(x => x.setAttribute('aria-pressed', x === b));
  b.blur(); reset();
}));
if (document.fonts) document.fonts.ready.then(draw);
reset();
</script>
</body>
</html>
